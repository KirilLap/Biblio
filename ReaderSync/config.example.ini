; Настройки робота ReaderSync. Скопируйте этот файл в config.ini и заполните.
; config.ini в репозиторий не попадает (он в .gitignore) — пароль хранится только на сервере.

[uznel]
; Адрес сайта UZNEL (страница входа)
url = https://uznel-rlps.natlib.uz:444/FN/app/index.html
; Отдельная учётная запись для робота
login =
password =

[bibadmin]
; Адрес сервера BibAdminWeb на этом же компьютере (порт — как в настройках сервера)
url = http://127.0.0.1:6969
; Файл с ключом: сервер создаёт его сам при запуске, в папке data\
token_file = C:\Program Files\Biblio\BibAdminWeb\data\reader_sync_token.txt

[sync]
; На сколько дней назад от прошлого успешного запуска перечитывать читателей (запас на пропуски)
overlap_days = 3
; С какой даты регистрации начинать ПОЛНУЮ загрузку (run_sync.cmd --full), ДД-ММ-ГГГГ.
; На ежедневные запуски не влияет — они берут только последние дни.
full_from = 01-01-2018
; Показывать окно браузера, чтобы наблюдать за шагами робота (yes / no).
; На сервере, где робот запускается Планировщиком, должно быть no — там окно показать некому.
show_browser = no
; Пауза между действиями в миллисекундах, когда окно показано (0 — без паузы)
slow_ms = 400
