<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — BibOperator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1E1E2E;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #2A2A3E;
    border-radius: 14px;
    padding: 40px 36px;
    width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  h1 {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #666688;
    font-size: 13px;
    margin-bottom: 28px;
  }
  label {
    display: block;
    color: #AAAACC;
    font-size: 12px;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input {
    width: 100%;
    background: #1E1E2E;
    border: 1px solid #3D3D6B;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: #4A90D9; }
  button {
    width: 100%;
    margin-top: 24px;
    background: #1D9E75;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    padding: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #17876A; }
  button:disabled { background: #444; cursor: default; }
  .error {
    margin-top: 14px;
    background: rgba(226,75,74,0.15);
    border: 1px solid rgba(226,75,74,0.4);
    border-radius: 8px;
    color: #E24B4A;
    font-size: 13px;
    padding: 10px 14px;
    display: none;
  }
</style>
</head>
<body>
<div class="card">
  <h1>BibOperator</h1>
  <div class="subtitle">Веб-интерфейс оператора</div>

  <label>Логин</label>
  <input id="login" type="text" autocomplete="username" placeholder="operator">

  <label>Пароль</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="••••••">

  <div id="error" class="error"></div>
  <button id="btn" onclick="doLogin()">Войти</button>
</div>

<script>
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  async function doLogin() {
    const login = document.getElementById('login').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn');
    const err = document.getElementById('error');

    if (!login || !password) {
      showError('Введите логин и пароль');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Вход...';
    err.style.display = 'none';

    try {
      const res = await fetch('/api/op/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login, password })
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = '/operator.html';
      } else {
        showError(data.error || 'Ошибка входа');
      }
    } catch (e) {
      showError('Нет связи с сервером');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Войти';
    }
  }

  function showError(msg) {
    const err = document.getElementById('error');
    err.textContent = msg;
    err.style.display = 'block';
  }

  // Если уже авторизован — редиректим
  fetch('/api/op/me').then(r => {
    if (r.ok) window.location.href = '/operator.html';
  }).catch(() => {});
</script>
</body>
</html>
