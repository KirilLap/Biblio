<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BibAdmin — Вход</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .card { background: #16213e; border-radius: 16px; padding: 40px; width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .logo { text-align: center; margin-bottom: 32px; }
  .logo h1 { color: #1d9e75; font-size: 28px; font-weight: 700; }
  .logo p { color: #888; font-size: 13px; margin-top: 6px; }
  label { display: block; color: #aaa; font-size: 12px; margin-bottom: 6px; font-weight: 500; letter-spacing: .5px; text-transform: uppercase; }
  input { width: 100%; background: #0f3460; border: 1px solid #1d4a7a; border-radius: 8px; padding: 12px 14px; color: #fff; font-size: 15px; margin-bottom: 20px; outline: none; transition: border-color .2s; }
  input:focus { border-color: #1d9e75; }
  button { width: 100%; background: #1d9e75; color: #fff; border: none; border-radius: 8px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .2s; }
  button:hover { background: #17856a; }
  .error { color: #f87171; font-size: 13px; text-align: center; margin-top: 14px; min-height: 18px; }
  .note { color: #555; font-size: 11px; text-align: center; margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>BibAdmin</h1>
    <p>Панель управления</p>
  </div>
  <label>Пароль администратора</label>
  <input type="password" id="pwd" placeholder="Введите пароль" autofocus>
  <button id="btn" onclick="login()">Войти</button>
  <div class="error" id="err"></div>
  <div class="note">Операторам: <a href="/login.html" style="color:#1d9e75;">войти как оператор</a></div>
</div>
<script>
  document.getElementById('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

  async function login() {
    const pwd = document.getElementById('pwd').value;
    const err = document.getElementById('err');
    const btn = document.getElementById('btn');
    if (!pwd) { err.textContent = 'Введите пароль'; return; }
    btn.disabled = true;
    btn.textContent = 'Вход...';
    try {
      const r = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
      });
      if (r.ok) {
        window.location.href = '/index.html';
      } else {
        const d = await r.json();
        err.textContent = d.error || 'Неверный пароль';
        btn.disabled = false; btn.textContent = 'Войти';
      }
    } catch {
      err.textContent = 'Ошибка соединения';
      btn.disabled = false; btn.textContent = 'Войти';
    }
  }
</script>
</body>
</html>
