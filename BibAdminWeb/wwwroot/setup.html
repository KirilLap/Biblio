<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblio — Первый запуск</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .card { background: #16213e; border-radius: 16px; padding: 40px; width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .logo { text-align: center; margin-bottom: 32px; }
  .logo h1 { color: #1d9e75; font-size: 32px; font-weight: 700; }
  .logo p { color: #888; font-size: 13px; margin-top: 8px; line-height: 1.5; }
  label { display: block; color: #aaa; font-size: 11px; margin-bottom: 6px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; }
  input { width: 100%; background: #0f3460; border: 1px solid #1d4a7a; border-radius: 8px; padding: 12px 14px; color: #fff; font-size: 15px; margin-bottom: 20px; outline: none; transition: border-color .2s; }
  input:focus { border-color: #1d9e75; }
  button { width: 100%; background: #1d9e75; color: #fff; border: none; border-radius: 8px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .2s; }
  button:hover { background: #17856a; }
  button:disabled { background: #1a4a3a; color: #446655; cursor: default; }
  .error { color: #f87171; font-size: 13px; text-align: center; margin-top: 14px; min-height: 18px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>Biblio</h1>
    <p>Первый запуск — настройте сервер</p>
  </div>
  <label>Порт сервера</label>
  <input type="number" id="port" value="8080" min="1024" max="65535">
  <label>Новый пароль</label>
  <input type="password" id="pwd" placeholder="Минимум 4 символа" autofocus>
  <label>Повторите пароль</label>
  <input type="password" id="confirm" placeholder="Введите пароль ещё раз">
  <button id="btn" onclick="setup()">Установить пароль и войти</button>
  <div class="error" id="err"></div>
</div>
<script>
  document.addEventListener('keydown', e => { if (e.key === 'Enter') setup(); });

  async function setup() {
    const port    = parseInt(document.getElementById('port').value);
    const pwd     = document.getElementById('pwd').value;
    const confirm = document.getElementById('confirm').value;
    const err     = document.getElementById('err');
    const btn     = document.getElementById('btn');

    err.textContent = '';

    if (!port || port < 1024 || port > 65535) { err.textContent = 'Порт должен быть числом от 1024 до 65535'; return; }
    if (pwd.length < 4)     { err.textContent = 'Пароль должен быть не менее 4 символов'; return; }
    if (pwd !== confirm)    { err.textContent = 'Пароли не совпадают'; return; }

    btn.disabled = true;
    btn.textContent = 'Сохранение...';

    try {
      const r = await fetch('/api/admin/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd, port: port })
      });
      if (r.ok) {
        window.location.href = '/index.html';
      } else {
        const d = await r.json();
        err.textContent = d.error || 'Ошибка';
        btn.disabled = false;
        btn.textContent = 'Установить пароль и войти';
      }
    } catch {
      err.textContent = 'Ошибка соединения';
      btn.disabled = false;
      btn.textContent = 'Установить пароль и войти';
    }
  }
</script>
</body>
</html>
