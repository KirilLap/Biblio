<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BibOperator</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Шапка -->
<header>
  <div class="logo">BibOperator</div>
  <div class="header-right">
    <span id="opName" class="op-name"></span>
    <div id="connDot" class="conn-dot offline" title="Нет связи с сервером"></div>
    <button class="btn-logout" onclick="doLogout()">Выйти</button>
  </div>
</header>

<!-- Тосты -->
<div id="toasts"></div>

<!-- Диалог: Начать сессию -->
<div id="dlgSession" class="dlg-overlay" onclick="closeDlgIfOverlay(event,'dlgSession')">
  <div class="dlg">
    <div class="dlg-title">Начать сессию</div>
    <div class="dlg-pc-name" id="dlgSessionPc"></div>

    <div class="field-row">
      <label>Тип сессии</label>
      <div class="radio-group">
        <label class="radio-opt"><input type="radio" name="stype" value="Лимит" checked> Лимит</label>
        <label class="radio-opt"><input type="radio" name="stype" value="VIP"> VIP (безлимит)</label>
      </div>
    </div>

    <div id="limitFields">
      <div class="field-row">
        <label>Время (мин)</label>
        <input id="dlgLimitMin" type="number" min="1" max="999" value="60" oninput="calcAmount()">
      </div>
      <div class="field-row">
        <label>Сумма (сум)</label>
        <input id="dlgAmount" type="number" min="0" value="0" oninput="calcTime()">
      </div>
    </div>

    <div id="rowUserName" class="field-row">
      <label id="lblUserName">Имя читателя <span class="opt">(необязательно)</span></label>
      <input id="dlgUserName" type="text" placeholder="Иванов Иван">
    </div>
    <div id="rowReaderId" class="field-row">
      <label id="lblReaderId">ID читателя <span class="opt">(необязательно)</span></label>
      <input id="dlgReaderId" type="text" placeholder="12345">
    </div>

    <div class="dlg-actions">
      <button class="btn-cancel" onclick="closeDlg('dlgSession')">Отмена</button>
      <button class="btn-primary" onclick="confirmStartSession()">Начать</button>
    </div>
  </div>
</div>

<!-- Диалог: Итог сессии -->
<div id="dlgSummary" class="dlg-overlay" onclick="closeDlgIfOverlay(event,'dlgSummary')">
  <div class="dlg">
    <div class="dlg-title">Сессия завершена</div>
    <div id="dlgSummaryBody" class="summary-body"></div>
    <div class="dlg-actions">
      <button id="btnRecordDebt" class="btn-cancel" style="display:none" onclick="openRecordDebtDlg()">💸 Записать долг</button>
      <button class="btn-primary" onclick="closeDlg('dlgSummary')">Закрыть</button>
    </div>
  </div>
</div>

<!-- Диалог: Записать долг -->
<div id="dlgDebt" class="dlg-overlay" onclick="closeDlgIfOverlay(event,'dlgDebt')">
  <div class="dlg">
    <div class="dlg-title">💸 Записать долг</div>
    <div class="field-row">
      <label>ID читателя</label>
      <div id="dlgDebtReader" style="font-weight:600;padding:6px 0"></div>
    </div>
    <div class="field-row">
      <label>Сумма долга (сум)</label>
      <input id="dlgDebtAmount" type="number" min="1" value="0">
    </div>
    <div class="field-row">
      <label>Примечание <span class="opt">(необязательно)</span></label>
      <input id="dlgDebtNote" type="text" placeholder="Не хватило денег на услуги">
    </div>
    <div class="dlg-actions">
      <button class="btn-cancel" onclick="closeDlg('dlgDebt')">Отмена</button>
      <button class="btn-primary" onclick="confirmRecordDebt()">Записать</button>
    </div>
  </div>
</div>

<!-- Диалог: Обрыв связи ПК -->
<div id="dlgOffline" class="dlg-overlay">
  <div class="dlg dlg-warn">
    <div class="dlg-title">⚠ Потеря связи с ПК</div>
    <div id="dlgOfflineBody" class="summary-body"></div>
    <div class="dlg-actions">
      <button class="btn-pause" onclick="resolveOffline('Pause')">⏸ Поставить на паузу</button>
      <button class="btn-continue" onclick="resolveOffline('Continue')">▶ Продолжить</button>
    </div>
  </div>
</div>

<!-- Диалог: Пересадка -->
<div id="dlgTransfer" class="dlg-overlay" onclick="closeDlgIfOverlay(event,'dlgTransfer')">
  <div class="dlg">
    <div class="dlg-title">↔ Пересадить сессию</div>
    <div class="dlg-pc-name" id="dlgTransferFrom"></div>
    <div class="field-row">
      <label>Выберите ПК назначения</label>
      <select id="dlgTransferTarget"></select>
    </div>
    <div id="dlgTransferError" style="color:#E24B4A;font-size:12px;margin-top:8px;display:none"></div>
    <div class="dlg-actions">
      <button class="btn-cancel" onclick="closeDlg('dlgTransfer')">Отмена</button>
      <button class="btn-primary" onclick="confirmTransfer()">Пересадить</button>
    </div>
  </div>
</div>

<!-- Диалог: Добавить время -->
<div id="dlgExtend" class="dlg-overlay" onclick="closeDlgIfOverlay(event,'dlgExtend')">
  <div class="dlg">
    <div class="dlg-title">⏱ Добавить время</div>
    <div class="dlg-pc-name" id="dlgExtPc"></div>
    <div class="field-row">
      <label>Добавить минут</label>
      <input id="dlgExtMin" type="number" min="1" max="999" value="30" oninput="calcExtAmount()">
    </div>
    <div class="field-row">
      <label>Добавить сумму (сум)</label>
      <input id="dlgExtAmount" type="number" min="0" value="0" oninput="calcExtTime()">
    </div>
    <div class="dlg-actions">
      <button class="btn-cancel" onclick="closeDlg('dlgExtend')">Отмена</button>
      <button class="btn-primary" onclick="confirmExtend()">Добавить</button>
    </div>
  </div>
</div>

<!-- Диалог: Услуга -->
<div id="dlgService" class="dlg-overlay" onclick="closeDlgIfOverlay(event,'dlgService')">
  <div class="dlg">
    <div class="dlg-title">Оказать услугу</div>

    <div class="field-row">
      <label>Тип услуги</label>
      <select id="dlgSvcType" onchange="updateSvcTotal()"></select>
    </div>
    <div class="field-row">
      <label>Количество</label>
      <input id="dlgSvcQty" type="number" min="1" max="999" value="1" oninput="updateSvcTotal()">
    </div>
    <div class="field-row">
      <label>Итого</label>
      <div id="dlgSvcTotal" class="total-display">—</div>
    </div>
    <div class="field-row">
      <label>Читатель <span class="opt">(необязательно)</span></label>
      <input id="dlgSvcReader" type="text" placeholder="Имя или ID">
    </div>
    <div class="field-row">
      <label>Оплата</label>
      <div class="radio-group">
        <label class="radio-opt"><input type="radio" name="svcPay" value="now" checked onchange="onSvcPayChange()"> Сейчас</label>
        <label class="radio-opt"><input type="radio" name="svcPay" value="later" onchange="onSvcPayChange()"> Позже (при расчёте)</label>
      </div>
    </div>

    <div id="rowSvcPc" class="field-row" style="display:none">
      <label>Привязать к ПК <span style="color:#E24B4A">*</span></label>
      <select id="dlgSvcPc" onchange="onSvcPcChange()">
        <option value="">— выберите ПК —</option>
      </select>
    </div>

    <div class="dlg-actions">
      <button class="btn-cancel" onclick="closeDlg('dlgService')">Отмена</button>
      <button class="btn-primary" onclick="confirmService()">Создать</button>
    </div>
  </div>
</div>

<!-- Модальное окно: просмотр экрана ПК -->
<div id="dlgScreenView" class="dlg-overlay" onclick="closeDlgIfOverlay(event,'dlgScreenView')">
  <div class="dlg dlg-wide">
    <div class="dlg-title" id="dlgScreenViewTitle">Экран ПК</div>
    <div style="text-align:center;background:#000;border-radius:6px;overflow:hidden;min-height:200px;display:flex;align-items:center;justify-content:center">
      <img id="screenViewImg" style="max-width:100%;max-height:65vh;display:block" src="" alt="Загрузка...">
    </div>
    <div style="font-size:12px;color:#777;margin-top:8px;text-align:center" id="screenViewStatus">Подключение...</div>
    <div class="dlg-actions">
      <button class="btn-primary" onclick="closeScreenView()">Закрыть</button>
    </div>
  </div>
</div>

<!-- Оверлей: перезапуск сервера -->
<div id="overlayRestart" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.82);z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px">
  <div style="font-size:48px">🔄</div>
  <div style="color:#fff;font-size:22px;font-weight:700">Сервер перезапускается</div>
  <div id="overlayRestartReason" style="color:#aaa;font-size:15px">Обновление системы</div>
  <div style="color:#ccc;font-size:13px;margin-top:8px">Страница обновится автоматически после запуска сервера</div>
  <div style="width:48px;height:48px;border:4px solid #444;border-top-color:#1d9e75;border-radius:50%;animation:spin 1s linear infinite;margin-top:8px"></div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<!-- Основная область -->
<main>
  <!-- Статистика -->
  <div class="stats-bar">
    <div class="stat-item"><span id="stTotal">0</span><small>ПК всего</small></div>
    <div class="stat-item"><span id="stOnline">0</span><small>онлайн</small></div>
    <div class="stat-item stat-green"><span id="stSessions">0</span><small>сессий</small></div>
    <div class="stat-item stat-amber"><span id="stLocked">0</span><small>заблок.</small></div>
    <button class="btn-service-top" onclick="openServiceDlg()">🛎 Услуга</button>
    <button class="btn-service-top" onclick="restartAll()" style="background:#f5a623;margin-left:4px">🔄 Перезагрузить</button>
    <button class="btn-service-top" onclick="shutdownAll()" style="background:#E24B4A;margin-left:4px">⏻ Выкл. все</button>
  </div>

  <!-- Грид ПК -->
  <div id="grid" class="pc-grid"></div>

  <!-- Панель действий -->
  <div id="actionBar" class="action-bar hidden">
    <div id="abPcName" class="ab-pc-name"></div>
    <div id="abStatus" class="ab-status"></div>
    <div id="abActions" class="ab-actions"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script src="/operator.js"></script>
</body>
</html>
